<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1440"/>
      <stop offset="0.45" stop-color="#8a2a8c"/>
      <stop offset="0.75" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#ff9f5a"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1660"/>
      <stop offset="1" stop-color="#1b0f2e"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="512" height="512" fill="white"/>
      <rect x="0" y="262" width="512" height="9" fill="black"/>
      <rect x="0" y="286" width="512" height="12" fill="black"/>
      <rect x="0" y="312" width="512" height="15" fill="black"/>
    </mask>
    <clipPath id="below"><rect x="0" y="340" width="512" height="172"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffe9dc" opacity="0.8">
    <circle cx="92" cy="86" r="3"/><circle cx="420" cy="70" r="2.5"/><circle cx="380" cy="132" r="2"/>
    <circle cx="140" cy="150" r="2"/><circle cx="458" cy="190" r="2"/>
  </g>
  <!-- striped sun -->
  <circle cx="256" cy="250" r="138" fill="url(#sun)" mask="url(#stripes)"/>
  <!-- sea + synthwave grid -->
  <rect x="0" y="340" width="512" height="172" fill="url(#sea)"/>
  <g clip-path="url(#below)" stroke="#2de2e6" stroke-width="3" opacity="0.75" fill="none">
    <line x1="0" y1="340" x2="512" y2="340" stroke="#ff7ab8" stroke-width="5"/>
    <line x1="0" y1="358" x2="512" y2="358"/><line x1="0" y1="382" x2="512" y2="382"/>
    <line x1="0" y1="414" x2="512" y2="414"/><line x1="0" y1="456" x2="512" y2="456"/>
    <line x1="256" y1="340" x2="256" y2="512"/>
    <line x1="256" y1="340" x2="130" y2="512"/><line x1="256" y1="340" x2="382" y2="512"/>
    <line x1="256" y1="340" x2="0" y2="512"/><line x1="256" y1="340" x2="512" y2="512"/>
    <line x1="256" y1="340" x2="-130" y2="512"/><line x1="256" y1="340" x2="642" y2="512"/>
  </g>
  <!-- palm tree -->
  <g fill="#1b0f2e">
    <path d="M150 512 C 156 440, 168 360, 196 252 L 208 255 C 184 360, 176 440, 176 512 Z"/>
    <path d="M200 252 C 160 205, 100 196, 52 222 C 104 214, 150 226, 200 252 Z"/>
    <path d="M200 252 C 176 196, 132 160, 80 160 C 128 178, 166 210, 200 252 Z"/>
    <path d="M202 250 C 212 196, 250 158, 302 150 C 258 174, 228 206, 202 250 Z"/>
    <path d="M204 252 C 250 222, 304 222, 346 250 C 300 238, 254 240, 204 252 Z"/>
    <path d="M202 254 C 182 262, 150 290, 138 322 C 160 296, 182 278, 202 254 Z"/>
    <path d="M204 254 C 232 262, 262 286, 276 316 C 252 292, 230 276, 204 254 Z"/>
    <circle cx="198" cy="258" r="9"/><circle cx="212" cy="262" r="8"/>
  </g>
</svg>
